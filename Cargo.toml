[workspace]
members = ["crates/contrib-scout", "crates/contrib-scout-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freesialuo/contrib-scout"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
httpdate = "1"
rand = "0.9"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
